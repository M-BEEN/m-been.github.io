# 루트 도메인에서 서빙한다(User Page). 서브디렉터리(/blog-kr/)로 두면 구글이 사이트 이름을
# 지정할 수 없어(사이트명은 도메인 단위로만 인식) 검색결과에 'GitHub Pages documentation'
# 으로 노출됐다. 그래서 blog-kr repo 에서 이 저장소로 옮겼다.
#
# 2026-08-01 커스텀 도메인 전환. github.io 서브도메인에서는 서치콘솔이 사이트맵을 끝내
# 읽지 못했다("가져올 수 없음" — 서버는 200·application/xml·유효 XML 로 정상인데도).
# GitHub Pages 가 m-been.github.io → 이 도메인으로 301 을 자동 제공하므로 기존 색인은 이전된다.
# ⚠ 커스텀 도메인은 static/CNAME 으로 관리한다 — Actions 배포는 매 빌드마다 public/ 을
#   새로 만들어서, Pages 설정 UI 에만 입력하면 CNAME 파일이 날아간다.
baseURL = "https://yieldrecipe.com/"
locale = "ko-kr"
defaultContentLanguage = "ko"
# 날짜 없는 date 프런트매터를 KST 자정으로 해석 — cron이 08:00 KST(=전날 23:00 UTC)에
# 돌 때 당일 글이 UTC 기준 미래가 되어 buildFuture=false 로 누락되던 문제 방지.
timeZone = "Asia/Seoul"
title = "한국증시 레시피"
# 커스텀 레이아웃(layouts/) 사용 — PaperMod 미사용(recipe 디자인 포팅)
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "한국 증시 일일 보고서·주간 분석·투자 상식을 데이터 기반으로 정리합니다. 투자 권유가 아닌 정보 제공입니다."
  author = "한국증시 레시피"
  defaultTheme = "auto"
  ShowToc = true
  TocOpen = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowShareButtons = false
  hideFooter = false
  # Google AdSense 게시자 ID('ca-pub-XXXXXXXXXXXXXXXX').
  # ⚠ '승인 후'가 아니라 **신청 전에** 채워야 한다 — 애드센스는 사이트에 코드가 올라가 있어야
  #   검토를 시작한다. 비어 있으면 "사이트에 연결할 수 없음"으로 검토가 진행되지 않는다.
  #   게시자 ID 는 애드센스 가입 직후(사이트 승인 전) 바로 발급된다.
  # 채우면 <head> 에 두 가지가 함께 출력된다 — 소유확인 메타태그 + 광고 스크립트.
  # 애드센스가 요구하는 확인 방식이 셋(스크립트 / 메타태그 / ads.txt) 중 무엇이든 대응된다.
  adsenseClient = "ca-pub-1025105664734067"
  # 구글 서치콘솔 'HTML 태그' 인증 코드(content 값만). 서치콘솔에서 발급받아 붙여넣으면
  # <head> 에 google-site-verification 메타태그가 출력된다. 인증 후에도 남겨둘 것.
  googleSiteVerification = "DUgARfMVJZfQkfIT17I0JUnQv5zYUiwe7VbRH8eZIcQ"
  # 네이버 서치어드바이저 소유확인 코드(content 값만). 구글과 별개 채널이고,
  # 국내 증시 콘텐츠는 네이버 유입 비중이 크다. 인증 후 태그를 지우면 소유확인이
  # 풀리므로 남겨둘 것.
  # ⚠ 사이트 URL 이 바뀌면(github.io → yieldrecipe.com) 네이버는 **다른 사이트로 보고**
  #   새 코드를 발급한다. 옛 코드를 그대로 두면 소유확인이 안 된다 — URL 변경 시 재발급 필수.
  naverSiteVerification = "f559a0c77705e3528f35866236b7eff21fb04ec0"

[params.homeInfoParams]
  Title = "한국증시 레시피 🍳"
  Content = "매일의 증시 흐름과 종목 신호를 데이터로 정리합니다. **투자 권유가 아닌 정보 제공**이며, 모든 판단과 책임은 투자자 본인에게 있습니다."

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

# 취소선 확장을 끈다. GFM strikethrough 는 `~~양쪽~~` 뿐 아니라 `~한쪽~` 도 취소선으로
# 처리한다. 그런데 본문에는 `1976~2022년`, `08:00~08:50`, `520~560억달러` 같은 범위 표기가
# 상시로 나오고, 한 문단에 둘 이상 등장하면 그 사이 문장이 통째로 <del> 이 된다.
# 실제 사고(2026-08-11 에 전부 수정): guide-averaging-in 의 뱅가드 연구 인용 124자,
# 2026-07-19-weekly 의 TSMC capex 문장, guide-order-types 의 NXT 거래시간 줄.
# 빌드는 성공하므로 배포된 화면을 봐야만 발견된다.
# 취소선은 이 사이트에서 쓴 적이 없고(지금까지 나온 <del> 은 전부 사고였다), 일일·주간 글은
# report-service 가 자동 생성하므로 원고 쪽 규칙만으로는 재발을 막을 수 없어 여기서 끈다.
# 다른 확장(table·linkify·taskList 등)은 명시하지 않으면 기본값 그대로 켜져 있다.
[markup.goldmark.extensions]
  strikethrough = false

[outputs]
  home = ["HTML", "RSS"]

