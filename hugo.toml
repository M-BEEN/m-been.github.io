# 루트 도메인에서 서빙한다(User Page). 서브디렉터리(/blog-kr/)로 두면 구글이 사이트 이름을
# 지정할 수 없어(사이트명은 도메인 단위로만 인식) 검색결과에 'GitHub Pages documentation'
# 으로 노출됐다. 그래서 blog-kr repo 에서 이 저장소로 옮겼다.
#
# 2026-08-01 커스텀 도메인 전환. github.io 서브도메인에서는 서치콘솔이 사이트맵을 끝내
# 읽지 못했다("가져올 수 없음" — 서버는 200·application/xml·유효 XML 로 정상인데도).
# GitHub Pages 가 m-been.github.io → 이 도메인으로 301 을 자동 제공하므로 기존 색인은 이전된다.
# ⚠ 커스텀 도메인은 static/CNAME 으로 관리한다 — Actions 배포는 매 빌드마다 public/ 을
#   새로 만들어서, Pages 설정 UI 에만 입력하면 CNAME 파일이 날아간다.
baseURL = "https://yieldrecipe.com/"
locale = "ko-kr"
defaultContentLanguage = "ko"
# 날짜 없는 date 프런트매터를 KST 자정으로 해석 — cron이 08:00 KST(=전날 23:00 UTC)에
# 돌 때 당일 글이 UTC 기준 미래가 되어 buildFuture=false 로 누락되던 문제 방지.
timeZone = "Asia/Seoul"
title = "한국증시 레시피"
# 커스텀 레이아웃(layouts/) 사용 — PaperMod 미사용(recipe 디자인 포팅)
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "한국 증시 일일 보고서·주간 분석·투자 상식을 데이터 기반으로 정리합니다. 투자 권유가 아닌 정보 제공입니다."
  author = "한국증시 레시피"
  defaultTheme = "auto"
  ShowToc = true
  TocOpen = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowShareButtons = false
  hideFooter = false
  # AdSense 승인 후 'ca-pub-XXXXXXXXXXXXXXXX' 로 채우면 자동광고 스크립트가 활성화됨
  adsenseClient = ""
  # 구글 서치콘솔 'HTML 태그' 인증 코드(content 값만). 서치콘솔에서 발급받아 붙여넣으면
  # <head> 에 google-site-verification 메타태그가 출력된다. 인증 후에도 남겨둘 것.
  googleSiteVerification = "DUgARfMVJZfQkfIT17I0JUnQv5zYUiwe7VbRH8eZIcQ"
  # 네이버 서치어드바이저 소유확인 코드(content 값만). 구글과 별개 채널이고,
  # 국내 증시 콘텐츠는 네이버 유입 비중이 크다. 인증 후 태그를 지우면 소유확인이
  # 풀리므로 남겨둘 것.
  # ⚠ 사이트 URL 이 바뀌면(github.io → yieldrecipe.com) 네이버는 **다른 사이트로 보고**
  #   새 코드를 발급한다. 옛 코드를 그대로 두면 소유확인이 안 된다 — URL 변경 시 재발급 필수.
  naverSiteVerification = "f559a0c77705e3528f35866236b7eff21fb04ec0"

[params.homeInfoParams]
  Title = "한국증시 레시피 🍳"
  Content = "매일의 증시 흐름과 종목 신호를 데이터로 정리합니다. **투자 권유가 아닌 정보 제공**이며, 모든 판단과 책임은 투자자 본인에게 있습니다."

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS"]

